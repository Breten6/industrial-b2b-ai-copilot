name: Phase 1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: docker compose run --rm --no-deps -e COVERAGE_FILE=/tmp/copilot.coverage api python -m pytest --cov=app --cov-report=term-missing
      - name: Smoke-test the catalog through the web service
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused 'http://127.0.0.1:3000/?q=DEMO-IMG' -o /tmp/copilot.html
          grep -Fq 'Product category: Imaging sonar.' /tmp/copilot.html
      - name: Exercise upload, review, and comparison through the web service
        run: node apps/web/tests/stack-smoke.mjs
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
